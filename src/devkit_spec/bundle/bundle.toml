schema = 1
name = "spec"
version = "0.1.0"
default_preset = "core"
auto_select = true

# Normative wording, measurable contracts, non-goals and policy exceptions.
[[assets]]
id = "contract-authoring"
kind = "instruction"
source = "instructions/contract-authoring.md"

# Current-state writing, history placement, completed specs, traceability and ID references.
[[assets]]
id = "living-spec-writing"
kind = "instruction"
source = "instructions/living-spec-writing.md"

# The AGENTS.md line that sends every session to the spec bundle's context before development work.
[[assets]]
id = "spec-pointer"
kind = "guidance"
source = "guidance/spec-pointer.md"

# Documents reference each other by exact, resolvable full IDs.
[[assets]]
id = "document-reference"
kind = "rule"
source = "rules/document_reference"

# Paths, IDs and heading tokens follow the slug conventions; no date- or number-based references.
[[assets]]
id = "id-convention"
kind = "rule"
source = "rules/id_convention"

# Capabilities, stories and proposals carry id, title and status frontmatter.
[[assets]]
id = "spec-format"
kind = "rule"
source = "rules/spec_format"

# Story and capability links are bidirectional.
[[assets]]
id = "traceability-link"
kind = "rule"
source = "rules/traceability_link"

# Every acceptance criterion of a spec is covered by a task, and tasks cite only defined ones.
[[assets]]
id = "task-coverage"
kind = "rule"
source = "rules/task_coverage"

# A spec's status agrees with its reconcile record and task checklist.
[[assets]]
id = "spec-lifecycle"
kind = "rule"
source = "rules/spec_lifecycle"

# Entry router: classify intent, choose the route and drive the workflow.
[[assets]]
id = "spec"
kind = "skill"
source = "skills/spec"

# Orient in work under way: diagnose the stage and the next action.
[[assets]]
id = "spec-next"
kind = "skill"
source = "skills/spec-next"

# Write spec.md: requirements, non-goals and acceptance criteria.
[[assets]]
id = "spec-specify"
kind = "skill"
source = "skills/spec-specify"

# Write plan.md: design, interfaces and verification plan.
[[assets]]
id = "spec-plan"
kind = "skill"
source = "skills/spec-plan"

# Write tasks.md: tasks covering every acceptance criterion.
[[assets]]
id = "spec-tasks"
kind = "skill"
source = "skills/spec-tasks"

# Verify the change against the spec, tests and checks before completion.
[[assets]]
id = "spec-review"
kind = "skill"
source = "skills/spec-review"

# Reconcile the change into the Living Spec and resolve reconcile.md.
[[assets]]
id = "spec-sync"
kind = "skill"
source = "skills/spec-sync"

# Integrate an approved change: conflicts, docs reflection, merge and cleanup.
[[assets]]
id = "spec-integrate"
kind = "skill"
source = "skills/spec-integrate"

# Delegate a stage to a role contract and record its envelope.
[[assets]]
id = "spec-delegate"
kind = "skill"
source = "skills/spec-delegate"

# Challenge a direction before it is chosen.
[[assets]]
id = "spec-challenge"
kind = "skill"
source = "skills/spec-challenge"

# Scout prior art and evidence for a proposal.
[[assets]]
id = "spec-scout"
kind = "skill"
source = "skills/spec-scout"

# Author or tune a project rule for devkit rules.
[[assets]]
id = "spec-rule"
kind = "skill"
source = "skills/spec-rule"

# Record and sweep feedback observations.
[[assets]]
id = "spec-feedback"
kind = "skill"
source = "skills/spec-feedback"

# The docs/ skeleton (Living Spec directories, arc42 chapters, glossary, search synonyms): written once where absent,
# then project-owned. Opt-in preset, so an existing docs/ tree never receives files it did not ask for.
[[assets]]
id = "docs-skeleton"
kind = "document"
seeded = true
source = "seed/docs"
target = "docs"

# A reconcile.md record has an id, a pending or resolved status and well-formed targets.
[[assets]]
id = "reconcile-contract"
kind = "rule"
source = "rules/reconcile_contract"

# Starting points for new documents, read by path (.devkit/managed/spec/templates/<kind>.md).
[[assets]]
id = "templates"
kind = "document"
source = "templates"

# Delivery workflows: routed stage schemas with the intent, direction and integration gates.
[[assets]]
id = "s-lane"
kind = "workflow"
source = "workflows/s-lane.md"

[[assets]]
id = "direct-delivery"
kind = "workflow"
source = "workflows/direct-delivery.md"

[[assets]]
id = "bugfix"
kind = "workflow"
source = "workflows/bugfix.md"

[[assets]]
id = "incubated-delivery"
kind = "workflow"
source = "workflows/incubated-delivery.md"

# Optional support roles the workflows delegate to: host-neutral contracts, projected per agent.
[[assets]]
id = "challenger"
kind = "subagent"
source = "subagents/challenger.md"

[[assets]]
id = "reconciler"
kind = "subagent"
source = "subagents/reconciler.md"

[[assets]]
id = "reviewer"
kind = "subagent"
source = "subagents/reviewer.md"

[[assets]]
id = "scout"
kind = "subagent"
source = "subagents/scout.md"

# Occasional procedures, found through `devkit playbook search` on explicit request.
[[assets]]
id = "brownfield-adoption"
kind = "playbook"
source = "playbooks/brownfield-adoption"

[[assets]]
id = "feedback-hygiene"
kind = "playbook"
source = "playbooks/feedback-hygiene"

[presets.core]
assets = [
    "contract-authoring",
    "living-spec-writing",
    "spec-pointer",
    "document-reference",
    "id-convention",
    "spec-format",
    "traceability-link",
    "task-coverage",
    "spec-lifecycle",
    "reconcile-contract",
    "templates",
    "spec",
    "spec-next",
    "spec-specify",
    "spec-plan",
    "spec-tasks",
    "spec-review",
    "spec-sync",
    "spec-integrate",
    "spec-delegate",
    "spec-challenge",
    "spec-scout",
    "spec-rule",
    "spec-feedback",
    "s-lane",
    "direct-delivery",
    "bugfix",
    "incubated-delivery",
    "challenger",
    "reconciler",
    "reviewer",
    "scout",
    "brownfield-adoption",
    "feedback-hygiene",
]

[presets.docs-skeleton]
assets = ["docs-skeleton"]
