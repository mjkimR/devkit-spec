schema = 1
name = "spec"
version = "0.1.0"
default_preset = "core"
auto_select = true

# Normative wording, measurable contracts, non-goals and policy exceptions.
[[assets]]
id = "contract-authoring"
kind = "instruction"
source = "instructions/contract-authoring.md"

# Current-state writing, history placement, completed specs, traceability and ID references.
[[assets]]
id = "living-spec-writing"
kind = "instruction"
source = "instructions/living-spec-writing.md"

# The AGENTS.md line that sends every session to the spec bundle's context before development work.
[[assets]]
id = "spec-pointer"
kind = "guidance"
source = "guidance/spec-pointer.md"

# Documents reference each other by exact, resolvable full IDs.
[[assets]]
id = "document-reference"
kind = "rule"
source = "rules/document_reference"

# Paths, IDs and heading tokens follow the slug conventions; no date- or number-based references.
[[assets]]
id = "id-convention"
kind = "rule"
source = "rules/id_convention"

# Capabilities, stories and proposals carry id, title and status frontmatter.
[[assets]]
id = "spec-format"
kind = "rule"
source = "rules/spec_format"

# Story and capability links are bidirectional.
[[assets]]
id = "traceability-link"
kind = "rule"
source = "rules/traceability_link"

# Every acceptance criterion of a spec is covered by a task, and tasks cite only defined ones.
[[assets]]
id = "task-coverage"
kind = "rule"
source = "rules/task_coverage"

# A spec's status agrees with its reconcile record and task checklist.
[[assets]]
id = "spec-lifecycle"
kind = "rule"
source = "rules/spec_lifecycle"

# A spec whose tasks have started is marked in-progress (warning).
[[assets]]
id = "spec-progress"
kind = "rule"
source = "rules/spec_progress"

# Entry router: classify the task (task-kind, planning-depth), run Backlog and inline Planning, drive the workflow.
[[assets]]
id = "spec"
kind = "skill"
source = "skills/spec"

# Orient in work under way: diagnose the stage and the next action.
[[assets]]
id = "spec-next"
kind = "skill"
source = "skills/spec-next"

# Write spec.md: requirements, non-goals and acceptance criteria.
[[assets]]
id = "spec-specify"
kind = "skill"
source = "skills/spec-specify"

# Write plan.md: design, interfaces and verification plan.
[[assets]]
id = "spec-plan"
kind = "skill"
source = "skills/spec-plan"

# Write tasks.md: tasks covering every acceptance criterion.
[[assets]]
id = "spec-tasks"
kind = "skill"
source = "skills/spec-tasks"

# Verify the change against the spec, tests and checks before completion.
[[assets]]
id = "spec-review"
kind = "skill"
source = "skills/spec-review"

# Reconcile the change into the Living Spec and resolve reconcile.md.
[[assets]]
id = "spec-sync"
kind = "skill"
source = "skills/spec-sync"

# Integrate an approved change: conflicts, docs reflection, merge and cleanup.
[[assets]]
id = "spec-integrate"
kind = "skill"
source = "skills/spec-integrate"

# Delegate a stage to a role contract and record its envelope.
[[assets]]
id = "spec-delegate"
kind = "skill"
source = "skills/spec-delegate"

# Orchestration mode: the user switches the session to coordinating workers in their own worktrees.
[[assets]]
id = "spec-orchestrate"
kind = "skill"
source = "skills/spec-orchestrate"
invocation = "user"

# Author or tune a project rule for devkit rules.
[[assets]]
id = "spec-rule"
kind = "skill"
source = "skills/spec-rule"

# Record and sweep feedback observations.
[[assets]]
id = "spec-feedback"
kind = "skill"
source = "skills/spec-feedback"

# Derive capability/story entrypoints from spec bundles, review them and write the chosen ones.
[[assets]]
id = "spec-entrypoints"
kind = "skill"
source = "skills/spec-entrypoints"

# The docs/ skeleton (Living Spec directories, arc42 chapters, glossary, search synonyms): written once where absent,
# then project-owned. Opt-in preset, so an existing docs/ tree never receives files it did not ask for.
[[assets]]
id = "docs-skeleton"
kind = "document"
seeded = true
source = "seed/docs"
target = "docs"

# A reconcile.md record has an id, a pending or resolved status and well-formed targets.
[[assets]]
id = "reconcile-contract"
kind = "rule"
source = "rules/reconcile_contract"

# Every entrypoints path of a capability or story is an existing workspace file or directory.
[[assets]]
id = "code-entrypoints"
kind = "rule"
source = "rules/code_entrypoints"

# Searchable documents carry a short English summary, the main signal of document search.
[[assets]]
id = "document-summary"
kind = "rule"
source = "rules/document_summary"

# Starting points for new documents, read by path (.devkit/managed/spec/templates/<kind>.md).
[[assets]]
id = "templates"
kind = "document"
source = "templates"

# Delivery workflows, one per planning-depth and task-kind (sdd-<planning-depth>[-<task-kind>]), with the
# plan-intent, plan-accept and dev-integration gates.
[[assets]]
id = "sdd-session-feature"
kind = "workflow"
source = "workflows/sdd-session-feature.md"

[[assets]]
id = "sdd-session-bugfix"
kind = "workflow"
source = "workflows/sdd-session-bugfix.md"

[[assets]]
id = "sdd-spec-feature"
kind = "workflow"
source = "workflows/sdd-spec-feature.md"

[[assets]]
id = "sdd-spec-bugfix"
kind = "workflow"
source = "workflows/sdd-spec-bugfix.md"

[[assets]]
id = "sdd-proposal"
kind = "workflow"
source = "workflows/sdd-proposal.md"

# Optional support roles the workflows delegate to: host-neutral contracts, projected per agent; the body is the
# role's prompt, so a procedure no main session runs lives there rather than in a skill.
[[assets]]
id = "challenger"
kind = "subagent"
source = "subagents/challenger.md"

[[assets]]
id = "reconcile-reviewer"
kind = "subagent"
source = "subagents/reconcile-reviewer.md"

[[assets]]
id = "code-reviewer"
kind = "subagent"
source = "subagents/code-reviewer.md"

[[assets]]
id = "scout"
kind = "subagent"
source = "subagents/scout.md"

[[assets]]
id = "development-worker"
kind = "subagent"
source = "subagents/development-worker.md"

[[assets]]
id = "planning-worker"
kind = "subagent"
source = "subagents/planning-worker.md"

# Occasional procedures, found through `devkit playbook search` on explicit request.
[[assets]]
id = "brownfield-adoption"
kind = "playbook"
source = "playbooks/brownfield-adoption"

[[assets]]
id = "feedback-hygiene"
kind = "playbook"
source = "playbooks/feedback-hygiene"

[presets.core]
assets = [
    "contract-authoring",
    "living-spec-writing",
    "spec-pointer",
    "document-reference",
    "id-convention",
    "spec-format",
    "traceability-link",
    "task-coverage",
    "spec-lifecycle",
    "spec-progress",
    "reconcile-contract",
    "document-summary",
    "code-entrypoints",
    "templates",
    "spec",
    "spec-next",
    "spec-specify",
    "spec-plan",
    "spec-tasks",
    "spec-review",
    "spec-sync",
    "spec-integrate",
    "spec-delegate",
    "spec-orchestrate",
    "spec-rule",
    "spec-feedback",
    "spec-entrypoints",
    "sdd-session-feature",
    "sdd-session-bugfix",
    "sdd-spec-feature",
    "sdd-spec-bugfix",
    "sdd-proposal",
    "challenger",
    "reconcile-reviewer",
    "code-reviewer",
    "scout",
    "development-worker",
    "planning-worker",
    "brownfield-adoption",
    "feedback-hygiene",
]

[presets.docs-skeleton]
assets = ["docs-skeleton"]
